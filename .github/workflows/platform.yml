name: Platform checks
on:
  pull_request:
  push:
    branches: [feature/aurico-3-platform]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: {NEXT_TELEMETRY_DISABLED: '1'}
      - run: npm audit --omit=dev --audit-level=high
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - run: ./gradlew :app:assemblePatientDebug :app:assembleDemoDebug :app:testPatientDebugUnitTest :app:lintPatientDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew :app:connectedPatientDebugAndroidTest
