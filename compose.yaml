# Development only: every exposed port is loopback-bound. No patient fixtures are seeded.
services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: aurico
      POSTGRES_USER: aurico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/setup-local.mjs}
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aurico -d aurico']
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm', '--http-port=8080']
    environment:
      AURICO_WEB_CLIENT_SECRET: ${AURICO_WEB_CLIENT_SECRET:?Run local setup}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run local setup}
      KC_HOSTNAME: http://127.0.0.1:8080
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./infra/realm.generated.json:/opt/keycloak/data/import/aurico.json:ro
      - keycloak-data:/opt/keycloak/data
    depends_on: [mailpit]
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports: ['127.0.0.1:8025:8025']
volumes:
  postgres-data:
  keycloak-data:
